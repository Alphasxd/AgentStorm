name: Bug report
description: Report a reproducible AgentStorm defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest Secret-free manifest or command sequence.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: AgentStorm digest, Kubernetes, architecture, and KEDA versions.
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data
      options:
        - label: I removed API keys, bearer tokens, real prompts, and production traces.
          required: true
