name: release-images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            image: ghcr.io/alphasxd/agentstorm-controller
            context: .
            file: Dockerfile.controller
          - component: worker
            image: ghcr.io/alphasxd/agentstorm-worker
            context: worker
            file: worker/Dockerfile
          - component: result-api
            image: ghcr.io/alphasxd/agentstorm-result-api
            context: .
            file: Dockerfile.result-api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release tag is not valid SemVer: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release commit $GITHUB_SHA is not on origin/main" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

      - name: Build and publish ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record published digest
        shell: bash
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo '${{ matrix.image }}@${{ steps.build.outputs.digest }}'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate stable tag and chart version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Helm charts are published only for stable SemVer tags" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          chart_version="$(awk '$1 == "version:" {print $2}' charts/agentstorm/Chart.yaml)"
          if [[ "v$chart_version" != "$GITHUB_REF_NAME" ]]; then
            echo "chart version $chart_version does not match $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Install Helm 4.2.2
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output /tmp/helm.tgz https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm /tmp/helm
      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | /tmp/helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package chart
        shell: bash
        run: |
          mkdir -p .out/chart
          /tmp/helm package charts/agentstorm --destination .out/chart
      - name: Attest chart package
        uses: actions/attest@v4
        with:
          subject-path: .out/chart/agentstorm-*.tgz
      - name: Publish OCI chart
        shell: bash
        run: /tmp/helm push .out/chart/agentstorm-*.tgz oci://ghcr.io/alphasxd/charts
