name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Go formatting
        run: test -z "$(gofmt -l api cmd internal)"
      - name: Test controller
        run: go test ./...
      - name: Vet controller
        run: go vet ./...
      - name: Test worker
        run: PYTHONPATH=worker/src python -m unittest discover -s worker/tests -v
      - name: Run no-cost smoke workload
        run: make worker-local
