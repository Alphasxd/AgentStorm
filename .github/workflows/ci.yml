name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install Worker dependencies
        run: python -m pip install -e worker
      - name: Install Helm 3.21.0 and 4.2.2
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output /tmp/helm3.tgz https://get.helm.sh/helm-v3.21.0-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --output /tmp/helm4.tgz https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz
          mkdir -p /tmp/helm3 /tmp/helm4
          tar -xzf /tmp/helm3.tgz -C /tmp/helm3
          tar -xzf /tmp/helm4.tgz -C /tmp/helm4
          mv /tmp/helm3/linux-amd64/helm /tmp/helm-3.21.0
          mv /tmp/helm4/linux-amd64/helm /tmp/helm-4.2.2
      - name: Lint and render the Helm chart with both major versions
        env:
          HELM3: /tmp/helm-3.21.0
          HELM4: /tmp/helm-4.2.2
        run: make helm-test
      - name: Validate fake canonical benchmark artifacts
        run: make test-benchmark
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test Helm 4 install, upgrade, and uninstall
        shell: bash
        run: |
          kind create cluster --name agentstorm-helm --wait 120s
          /tmp/helm-4.2.2 install agentstorm charts/agentstorm \
            --kube-context kind-agentstorm-helm --namespace agentstorm-system --create-namespace \
            --set controller.image.repository=agentstorm-controller \
            --set controller.image.tag=dev --set controller.image.pullPolicy=Never
          /tmp/helm-4.2.2 upgrade agentstorm charts/agentstorm \
            --kube-context kind-agentstorm-helm --namespace agentstorm-system \
            --set controller.image.repository=agentstorm-controller \
            --set controller.image.tag=dev --set controller.image.pullPolicy=Never \
            --set controller.leaderElection=true
          /tmp/helm-4.2.2 uninstall agentstorm \
            --kube-context kind-agentstorm-helm --namespace agentstorm-system

  promptfoo-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test no-model Promptfoo replay
        run: make test-promptfoo

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install worker dependencies
        run: python -m pip install -e worker
      - name: Check Go formatting
        run: test -z "$(gofmt -l api cmd internal)"
      - name: Test controller
        run: go test ./...
      - name: Cache envtest binaries
        uses: actions/cache@v6
        with:
          path: .cache/envtest
          key: envtest-${{ runner.os }}-v1.33.0
      - name: Test CRD contract
        run: make test-envtest
      - name: Vet controller
        run: go vet ./...
      - name: Test worker
        run: PYTHONPATH=worker/src python -m unittest discover -s worker/tests -v
      - name: Run no-cost smoke workload
        run: make worker-local
      - name: Run no-cost SRE Agent workload
        run: make sre-local

  results-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: agentstorm
          POSTGRES_USER: agentstorm
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentstorm -d agentstorm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install worker dependencies
        run: python -m pip install -e worker
      - name: Start object storage
        run: >-
          docker run --detach --name agentstorm-object-ci
          --publish 9000:9000
          --user 1000:1000
          --read-only
          --tmpfs /tmp:rw,nosuid,size=128m
          --cap-drop ALL
          --security-opt no-new-privileges
          --env MINIO_ROOT_USER=agentstorm
          --env MINIO_ROOT_PASSWORD=integration-only-secret
          --env MINIO_BROWSER=off
          --entrypoint /usr/bin/silo
          pgsty/silo:RELEASE.2026-10-15T00-00-00Z-distroless@sha256:70cac541c5a928be5cd16d6b8732d85ac06e891a0e3d9956a745381330692fc6
          server /data
      - name: Wait for object storage
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs agentstorm-object-ci
          exit 1
      - name: Test durable result storage
        env:
          AGENTSTORM_TEST_DATABASE_URL: postgres://agentstorm:integration-only@127.0.0.1:5432/agentstorm?sslmode=disable
          AGENTSTORM_TEST_S3_ENDPOINT: 127.0.0.1:9000
          AGENTSTORM_TEST_S3_ACCESS_KEY: agentstorm
          AGENTSTORM_TEST_S3_SECRET_KEY: integration-only-secret
        run: make test-results-integration
      - name: Test Worker to Result API pipeline
        env:
          AGENTSTORM_TEST_DATABASE_URL: postgres://agentstorm:integration-only@127.0.0.1:5432/agentstorm?sslmode=disable
          AGENTSTORM_TEST_S3_ENDPOINT: 127.0.0.1:9000
          AGENTSTORM_TEST_S3_ACCESS_KEY: agentstorm
          AGENTSTORM_TEST_S3_SECRET_KEY: integration-only-secret
        run: make test-result-pipeline
      - name: Stop object storage
        if: always()
        run: docker rm --force agentstorm-object-ci || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run namespace-scoped cluster E2E
        # hack/e2e-local.sh retries once on kind when the controller log contains
        # "error retrieving resource lock" and either rollout status times out or
        # another wait times out with a Complete worker Job.
        env:
          CLUSTER_PROVIDER: kind
          DEPLOYMENT_PROFILE: namespace
          KEEP_E2E_RESOURCES: 'false'
        run: make e2e-local

  results-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run durable result-stack E2E
        env:
          CLUSTER_PROVIDER: kind
          KEEP_E2E_RESOURCES: 'false'
        run: make e2e-results-local

  keda-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run durable KEDA queue E2E
        env:
          CLUSTER_PROVIDER: kind
          KEEP_E2E_RESOURCES: 'false'
        run: make e2e-keda-local
