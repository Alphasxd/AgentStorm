name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  promptfoo-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test no-model Promptfoo replay
        run: make test-promptfoo

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install worker dependencies
        run: python -m pip install -e worker
      - name: Check Go formatting
        run: test -z "$(gofmt -l api cmd internal)"
      - name: Test controller
        run: go test ./...
      - name: Cache envtest binaries
        uses: actions/cache@v6
        with:
          path: .cache/envtest
          key: envtest-${{ runner.os }}-v1.33.0
      - name: Test CRD contract
        run: make test-envtest
      - name: Vet controller
        run: go vet ./...
      - name: Test worker
        run: PYTHONPATH=worker/src python -m unittest discover -s worker/tests -v
      - name: Run no-cost smoke workload
        run: make worker-local

  results-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: agentstorm
          POSTGRES_USER: agentstorm
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentstorm -d agentstorm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install worker dependencies
        run: python -m pip install -e worker
      - name: Start MinIO
        run: >-
          docker run --detach --name agentstorm-minio-ci
          --publish 9000:9000
          --env MINIO_ROOT_USER=agentstorm
          --env MINIO_ROOT_PASSWORD=integration-only-secret
          minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs agentstorm-minio-ci
          exit 1
      - name: Test durable result storage
        env:
          AGENTSTORM_TEST_DATABASE_URL: postgres://agentstorm:integration-only@127.0.0.1:5432/agentstorm?sslmode=disable
          AGENTSTORM_TEST_S3_ENDPOINT: 127.0.0.1:9000
          AGENTSTORM_TEST_S3_ACCESS_KEY: agentstorm
          AGENTSTORM_TEST_S3_SECRET_KEY: integration-only-secret
        run: make test-results-integration
      - name: Test Worker to Result API pipeline
        env:
          AGENTSTORM_TEST_DATABASE_URL: postgres://agentstorm:integration-only@127.0.0.1:5432/agentstorm?sslmode=disable
          AGENTSTORM_TEST_S3_ENDPOINT: 127.0.0.1:9000
          AGENTSTORM_TEST_S3_ACCESS_KEY: agentstorm
          AGENTSTORM_TEST_S3_SECRET_KEY: integration-only-secret
        run: make test-result-pipeline
      - name: Stop MinIO
        if: always()
        run: docker rm --force agentstorm-minio-ci || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run namespace-scoped cluster E2E
        env:
          CLUSTER_PROVIDER: kind
          DEPLOYMENT_PROFILE: namespace
          KEEP_E2E_RESOURCES: 'false'
        run: make e2e-local

  results-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run durable result-stack E2E
        env:
          CLUSTER_PROVIDER: kind
          KEEP_E2E_RESOURCES: 'false'
        run: make e2e-results-local

  published-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run published-image smoke
        env:
          CLUSTER_PROVIDER: kind
          DEPLOYMENT_PROFILE: namespace
          KEEP_E2E_RESOURCES: 'false'
          SKIP_IMAGE_BUILD: 'true'
          LOAD_LOCAL_IMAGES: 'false'
          CONTROLLER_IMAGE: ghcr.io/alphasxd/agentstorm-controller@sha256:5d6e9785b17036bc3d47157b4d2c39038a92175bbcd6d90252054624b5062f6f
          WORKER_IMAGE: ghcr.io/alphasxd/agentstorm-worker@sha256:01232ba223ff3f2102ce274f126eac0633755888428b263772804dcd72c5be74
        run: make e2e-local

  published-result-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run published result-stack smoke
        env:
          CLUSTER_PROVIDER: kind
          KEEP_E2E_RESOURCES: 'false'
          SKIP_IMAGE_BUILD: 'true'
          LOAD_LOCAL_IMAGES: 'false'
          CONTROLLER_IMAGE: ghcr.io/alphasxd/agentstorm-controller@sha256:5d6e9785b17036bc3d47157b4d2c39038a92175bbcd6d90252054624b5062f6f
          WORKER_IMAGE: ghcr.io/alphasxd/agentstorm-worker@sha256:01232ba223ff3f2102ce274f126eac0633755888428b263772804dcd72c5be74
          RESULT_API_IMAGE: ghcr.io/alphasxd/agentstorm-result-api@sha256:0db0c0eaee89f7a075ab2cde212788a008741b814967c467ff20d08dd64c819c
        run: make e2e-results-local
