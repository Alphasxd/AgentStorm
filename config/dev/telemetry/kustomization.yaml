apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentstorm-system
resources:
  - ../results
  - collector.yaml
  - tempo.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: agentstorm-grafana-provisioning
    files:
      - datasources.yaml=grafana/datasources.yaml
      - dashboards.yaml=grafana/dashboards.yaml
  - name: agentstorm-grafana-dashboard
    files:
      - agentstorm-observability.json=grafana/agentstorm-observability.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: agentstorm-observability
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agentstorm-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --otel-exporter-otlp-endpoint=http://agentstorm-otel-collector:4318
