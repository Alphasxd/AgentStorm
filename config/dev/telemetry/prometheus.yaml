apiVersion: v1
kind: ConfigMap
metadata:
  name: agentstorm-prometheus
  labels:
    app.kubernetes.io/name: agentstorm-prometheus
    app.kubernetes.io/part-of: agentstorm-observability
data:
  prometheus.yaml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules.yaml
    scrape_configs:
      - job_name: agentstorm-result-api
        metrics_path: /metrics
        static_configs:
          - targets: [agentstorm-result-api:8080]
  rules.yaml: |
    groups:
      - name: agentstorm-result-api
        interval: 5s
        rules:
          - record: agentstorm:result_api_http_requests:rate5m
            expr: sum by (method, route) (rate(agentstorm_result_api_http_requests_total[5m]))
          - record: agentstorm:result_api_http_errors:ratio5m
            expr: sum(rate(agentstorm_result_api_http_requests_total{status_class=~"4xx|5xx"}[5m])) / clamp_min(sum(rate(agentstorm_result_api_http_requests_total[5m])), 0.000001)
          - record: agentstorm:result_api_http_request_duration:p95_5m
            expr: histogram_quantile(0.95, sum by (le, route) (rate(agentstorm_result_api_http_request_duration_seconds_bucket[5m])))
          - record: agentstorm:result_api_cost_usd:rate5m
            expr: sum by (direction) (rate(agentstorm_result_api_cost_usd_total[5m]))
          - record: agentstorm:result_api_case_failures:rate5m
            expr: sum by (category) (rate(agentstorm_result_api_case_failures_total[5m]))
          - record: agentstorm:result_api_retry_success:ratio5m
            expr: sum(rate(agentstorm_result_api_retries_total{outcome="succeeded"}[5m])) / clamp_min(sum(rate(agentstorm_result_api_retries_total[5m])), 0.000001)
          - record: agentstorm:result_api_injected_faults:rate5m
            expr: sum by (fault) (rate(agentstorm_result_api_injected_faults_total[5m]))
          - record: agentstorm:result_api_circuit_events:rate5m
            expr: sum by (event) (rate(agentstorm_result_api_circuit_events_total[5m]))
          - record: agentstorm:result_api_queue_claims:rate5m
            expr: sum by (outcome) (rate(agentstorm_result_api_queue_claims_total[5m]))
          - record: agentstorm:result_api_scheduler_permits:rate5m
            expr: sum by (outcome) (rate(agentstorm_result_api_scheduler_permits_total[5m]))
          - record: agentstorm:result_api_scheduler_permits_limited:ratio5m
            expr: sum(rate(agentstorm_result_api_scheduler_permits_total{outcome="limited"}[5m])) / clamp_min(sum(rate(agentstorm_result_api_scheduler_permits_total[5m])), 0.000001)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentstorm-prometheus
  labels:
    app.kubernetes.io/name: agentstorm-prometheus
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentstorm-prometheus
  labels:
    app.kubernetes.io/name: agentstorm-prometheus
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  selector:
    app.kubernetes.io/name: agentstorm-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentstorm-prometheus
  labels:
    app.kubernetes.io/name: agentstorm-prometheus
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-prometheus
        app.kubernetes.io/part-of: agentstorm-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:dda13e28bf95a5e5ca5b8ed56852006094c1c8e8871d9c9dbeed30aa6e55271f
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: storage
              mountPath: /prometheus
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agentstorm-prometheus
        - name: storage
          persistentVolumeClaim:
            claimName: agentstorm-prometheus
        - name: temporary
          emptyDir: {}
