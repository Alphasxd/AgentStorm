apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentstorm-grafana
  labels:
    app.kubernetes.io/name: agentstorm-grafana
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agentstorm-grafana
  labels:
    app.kubernetes.io/name: agentstorm-grafana
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  selector:
    app.kubernetes.io/name: agentstorm-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentstorm-grafana
  labels:
    app.kubernetes.io/name: agentstorm-grafana
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-grafana
        app.kubernetes.io/part-of: agentstorm-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/agentstorm.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/agentstorm.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboard
              mountPath: /etc/grafana/dashboards/agentstorm
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: agentstorm-grafana-provisioning
        - name: dashboard
          configMap:
            name: agentstorm-grafana-dashboard
        - name: storage
          persistentVolumeClaim:
            claimName: agentstorm-grafana
        - name: temporary
          emptyDir: {}
