apiVersion: v1
kind: ConfigMap
metadata:
  name: agentstorm-otel-collector
  labels:
    app.kubernetes.io/name: agentstorm-otel-collector
    app.kubernetes.io/part-of: agentstorm-observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: detailed
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: agentstorm-otel-collector
  labels:
    app.kubernetes.io/name: agentstorm-otel-collector
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  selector:
    app.kubernetes.io/name: agentstorm-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentstorm-otel-collector
  labels:
    app.kubernetes.io/name: agentstorm-otel-collector
    app.kubernetes.io/part-of: agentstorm-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-otel-collector
        app.kubernetes.io/part-of: agentstorm-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
          imagePullPolicy: IfNotPresent
          args: [--config=/etc/otelcol/collector.yaml]
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agentstorm-otel-collector
        - name: temporary
          emptyDir: {}
