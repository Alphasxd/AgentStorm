apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentstorm-system
resources:
  - ../../results
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agentstorm-result-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: agentstorm-result-api:dev
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels
        value:
          agentstorm.io/development-network-policy: disabled
