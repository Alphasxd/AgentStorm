apiVersion: v1
kind: Service
metadata:
  name: agentstorm-minio
  labels:
    app.kubernetes.io/name: agentstorm-minio
    app.kubernetes.io/part-of: agentstorm-results
spec:
  selector:
    app.kubernetes.io/name: agentstorm-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentstorm-minio
  labels:
    app.kubernetes.io/name: agentstorm-minio
    app.kubernetes.io/part-of: agentstorm-results
spec:
  serviceName: agentstorm-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-minio
        app.kubernetes.io/part-of: agentstorm-results
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z-distroless@sha256:70cac541c5a928be5cd16d6b8732d85ac06e891a0e3d9956a745381330692fc6
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/silo]
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: agentstorm-result-storage
                  key: s3-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstorm-result-storage
                  key: s3-secret-key
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: agentstorm-minio
          app.kubernetes.io/part-of: agentstorm-results
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
