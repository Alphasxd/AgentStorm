apiVersion: v1
kind: Service
metadata:
  name: agentstorm-postgres
  labels:
    app.kubernetes.io/name: agentstorm-postgres
    app.kubernetes.io/part-of: agentstorm-results
spec:
  selector:
    app.kubernetes.io/name: agentstorm-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentstorm-postgres
  labels:
    app.kubernetes.io/name: agentstorm-postgres
    app.kubernetes.io/part-of: agentstorm-results
spec:
  serviceName: agentstorm-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-postgres
        app.kubernetes.io/part-of: agentstorm-results
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: agentstorm
            - name: POSTGRES_USER
              value: agentstorm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstorm-result-storage
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, agentstorm, -d, agentstorm]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            exec:
              command: [pg_isready, -U, agentstorm, -d, agentstorm]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: temporary
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: agentstorm-postgres
          app.kubernetes.io/part-of: agentstorm-results
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
