apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentstorm-result-api
  labels:
    app.kubernetes.io/part-of: agentstorm-results
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-result-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentstorm-worker
        - podSelector:
            matchLabels:
              agentstorm.io/result-reader: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentstorm-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentstorm-minio
      ports:
        - protocol: TCP
          port: 9000
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentstorm-postgres
  labels:
    app.kubernetes.io/part-of: agentstorm-results
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentstorm-result-api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentstorm-minio
  labels:
    app.kubernetes.io/part-of: agentstorm-results
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentstorm-result-api
      ports:
        - protocol: TCP
          port: 9000
