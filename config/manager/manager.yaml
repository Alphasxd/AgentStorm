apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentstorm-controller
  namespace: agentstorm-system
  labels:
    app.kubernetes.io/name: agentstorm-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-controller
    spec:
      serviceAccountName: agentstorm-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/alphasxd/agentstorm-controller@sha256:28b5ba2bc2a1d2a8fa4e00154483981e1c5459229d44cefbc1a9bab0065f2eb0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
