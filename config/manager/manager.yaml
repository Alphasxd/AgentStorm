apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentstorm-controller
  namespace: agentstorm-system
  labels:
    app.kubernetes.io/name: agentstorm-controller
spec:
  # /readyz passes only after this process holds the leader lease.
  # maxUnavailable 1 and maxSurge 0 remove the current pod before the
  # replacement is created, and stay a RollingUpdate so a server-side apply
  # upgrade of an existing install is accepted. LeaderElectionReleaseOnCancel
  # frees the Lease during that shutdown. Additional replicas would stay
  # Running but unready, so rollout status completes only for this single replica.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentstorm-controller
    spec:
      serviceAccountName: agentstorm-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/alphasxd/agentstorm-controller@sha256:b37ae7edcbc5da61f5f1680f3aca5d5d6311c6a2b7745ebea088dde3279428ca
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
