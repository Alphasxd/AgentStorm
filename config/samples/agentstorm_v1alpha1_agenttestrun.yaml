apiVersion: v1
kind: ConfigMap
metadata:
  name: agentstorm-demo-dataset
data:
  cases.jsonl: |
    {"id":"greeting-1","input":"hello","expected_contains":"hello"}
    {"id":"greeting-2","input":"agent reliability","assertions":[{"type":"contains","value":"agent reliability"},{"type":"tool_path","path":["fake.echo"]},{"type":"latency","max_ms":1000}]}
---
apiVersion: agentstorm.io/v1alpha1
kind: AgentTestRun
metadata:
  name: agentstorm-demo
spec:
  target:
    provider: fake
    # adapterEntrypoint optionally selects trusted module:function code preinstalled in runner.image.
    pricing:
      inputUSDPerMillionTokens: "2.5"
      outputUSDPerMillionTokens: "10"
  workload:
    datasetRef:
      name: agentstorm-demo-dataset
      key: cases.jsonl
    parallelism: 2
    concurrencyPerWorker: 4
    iterations: 1
    timeoutSeconds: 300
  evaluation:
    minSuccessRate: 1
    maxErrorRate: 0
    maxP95LatencyMs: 1000
  telemetry:
    contentMode: omit
  runner:
    image: ghcr.io/alphasxd/agentstorm-worker@sha256:a06b8416f11355ddcfa470aa7932d9ce02546d8959a7ebee4c2ca2a53938cc41
    imagePullPolicy: IfNotPresent
