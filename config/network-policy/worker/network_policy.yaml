apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentstorm-worker
  namespace: agentstorm-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
