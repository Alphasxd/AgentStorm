apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentstorm-controller
  namespace: agentstorm-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentstorm-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
