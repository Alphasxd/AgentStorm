nameOverride: ""
fullnameOverride: ""

controller:
  # Keep this at 1 when leaderElection is true. Only the elected process passes
  # /readyz, so extra replicas stay Running but unready and rollout status does
  # not finish. /healthz remains a ping, so those replicas are not restarted
  # and can win the lease after the leader stops renewing it.
  replicaCount: 1
  image:
    repository: ghcr.io/alphasxd/agentstorm-controller
    tag: v0.6.0
    digest: ""
    pullPolicy: IfNotPresent
  # When true, the Deployment uses RollingUpdate maxUnavailable 1 and maxSurge 0,
  # and /readyz stays false until this process wins the lease. When false,
  # controller-runtime closes the elected channel after controllers start and the
  # Deployment keeps the Kubernetes default RollingUpdate.
  leaderElection: false
  resultSink:
    enabled: false
    url: ""
    existingAuthSecret: ""
    writeTokenKey: write-token
    includeSensitiveResults: false
    distributedLimits: false
  telemetry:
    otlpEndpoint: ""
    allowRedacted: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

serviceAccount:
  create: true
  name: ""

resultApi:
  enabled: false
  image:
    repository: ghcr.io/alphasxd/agentstorm-result-api
    tag: v0.6.0
    digest: ""
    pullPolicy: IfNotPresent
  existingStorageSecret: ""
  databaseURLKey: database-url
  s3Endpoint: ""
  s3AccessKeyKey: s3-access-key
  s3SecretKeyKey: s3-secret-key
  s3Bucket: agentstorm-results
  s3Region: us-east-1
  s3UseSSL: false
  existingAuthSecret: ""
  writeTokenKey: write-token
  readTokenKey: read-token
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi

keda:
  enabled: false
  metricsApiUrl: ""
  maxWorkersPerRun: 100
  maxInFlightCases: 1000
  requireRunnerResourceQuota: false
  pollingInterval: 2

networkPolicy:
  enabled: false
